<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <title>شركة GASTS | فخامة الإعلان في السعودية</title>
<meta name="description" content="إطلاق GASTS Luxury Agency رسمياً في السعودية. وكالة متخصصة في الهوية الفاخرة والتسويق الاحترافي.">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تواصل معنا | GASTS Luxury Agency</title>
<meta name="description" content="تواصل مع GASTS Luxury Agency لبدء مشروعك الفاخر في الهوية البصرية والتسويق الرقمي داخل السعودية.">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Cairo', sans-serif;
    background: #0f0f0f;
    color: #fff;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
    padding: 80px 20px;
}

header {
    text-align: center;
    margin-bottom: 60px;
}

header h1 {
    font-size: 42px;
    font-weight: 800;
    background: linear-gradient(90deg,#c6a75e,#f5e6c8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

header p {
    color: #aaa;
    margin-top: 15px;
}

.contact-wrapper {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(320px,1fr));
    gap: 40px;
}

.contact-info {
    background: #1a1a1a;
    padding: 40px;
    border-radius: 20px;
    border: 1px solid #222;
}

.contact-info h2 {
    color: #c6a75e;
    margin-bottom: 20px;
}

.contact-info a {
    display: block;
    color: #ddd;
    margin-bottom: 15px;
    text-decoration: none;
    transition: 0.3s;
}

.contact-info a:hover {
    color: #c6a75e;
}

form {
    background: #1a1a1a;
    padding: 40px;
    border-radius: 20px;
    border: 1px solid #222;
}

form h2 {
    color: #c6a75e;
    margin-bottom: 20px;
}

input, textarea {
    width: 100%;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 10px;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    font-family: 'Cairo', sans-serif;
}

input:focus, textarea:focus {
    outline: none;
    border-color: #c6a75e;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg,#c6a75e,#f5e6c8);
    color: #111;
    font-weight: 700;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    opacity: 0.85;
}

footer {
    text-align: center;
    padding: 40px;
    margin-top: 60px;
    border-top: 1px solid #222;
    color: #888;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>تواصل معنا</h1>
    <p>ابدأ رحلتك نحو علامة تجارية فاخرة معنا</p>
</header>

<div class="contact-wrapper">

    <!-- معلومات التواصل -->
    <div class="contact-info">
        <h2>معلومات التواصل</h2>

        <a href="mailto:gasts.work@outlook.sa">📩 gasts.work@outlook.sa</a>

        <a href="https://www.tiktok.com/@gasts.sa?_r=1&_t=ZS-93tLW3oya0O" target="_blank">TikTok</a>

        <a href="https://www.instagram.com/gasts.sa?igsh=MXEwZ2d0Mmpzd3VjMw%3D%3D&utm_source=qr" target="_blank">Instagram</a>

        <a href="https://share.upscrolled.com/ar/user/398e16ca-8c52-4dfd-a219-015c69c8e9e1/" target="_blank">Upscrolled</a>
    </div>

    <!-- نموذج التواصل -->
    <form action="mailto:gasts.work@outlook.sa" method="post" enctype="text/plain">
        <h2>أرسل رسالة</h2>

        <input type="text" name="name" placeholder="الاسم الكامل" required>

        <input type="email" name="email" placeholder="البريد الإلكتروني" required>

        <textarea name="message" rows="6" placeholder="اكتب رسالتك هنا..." required></textarea>

        <button type="submit">إرسال الرسالة</button>
    </form>

</div>

</div>

<footer>
    © 2026 GASTS Luxury Agency — جميع الحقوق محفوظة
</footer>

</body>
</html>
