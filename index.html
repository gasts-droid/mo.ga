<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة GASTS | فخامة الإعلان</title>
<meta name="description" content="GASTS Luxury Agency وكالة متخصصة في الهوية الفاخرة والتسويق الرقمي في السعودية.">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
:root{
--gold:#d4af37;
--dark:#05080a;
--border:rgba(212,175,55,0.2);
}

*{box-sizing:border-box;}

body{
margin:0;
font-family:'Cairo',sans-serif;
background:var(--dark);
color:#fff;
display:flex;
flex-direction:column;
min-height:100vh;
text-align:center;
}

header{
padding:60px 20px 30px;
}

.logo-text{
font-size:80px;
font-weight:900;
margin:0;
color:var(--gold);
}

.hero-desc{
max-width:600px;
margin:20px auto;
opacity:0.8;
line-height:1.8;
}

.btn{
display:inline-block;
background:#fff;
color:#000;
padding:15px 35px;
border-radius:50px;
text-decoration:none;
font-weight:700;
margin-top:20px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
}

.main{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:20px;
}

footer{
background:#000;
padding:40px 20px;
border-top:1px solid var(--border);
}

.footer-links{
margin-top:25px;
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.footer-links a{
text-decoration:none;
color:#fff;
padding:12px 25px;
border:1px solid var(--border);
border-radius:30px;
transition:0.3s;
}

.footer-links a:hover{
background:var(--gold);
color:#000;
}
</style>
</head>

<body>

<header>
<h1 class="logo-text">GASTS</h1>
<p class="hero-desc">
نحن نصنع الهوية الفاخرة ونقدم حلول تسويق احترافية تناسب العلامات التجارية الطموحة في السعودية.
</p>
<a href="https://www.tiktok.com/@gasts.sa" class="btn">حسابنا في تيك توك</a>
</header>

<div class="main">
<h2 style="color:var(--gold);">منصة GASTS قريباً</h2>
<p style="opacity:0.7;">ترقبوا إطلاق منصة عرض المنتجات الفاخرة.</p>
</div>

<footer>
<div>© 2026 GASTS LUXURY GROUP</div>

<div class="footer-links">
<a href="news.html">الخبر الرسمي</a>
<a href="about.html">من نحن</a>
</div>

</footer>

</body>
</html>
